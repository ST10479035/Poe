name: .NET CI/CD Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore RaceDayAPI/RaceDayAPI.sln

    - name: Build
      run: dotnet build RaceDayAPI/RaceDayAPI.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test RaceDayAPI/RaceDayAPI.sln --no-restore --verbosity normal
